<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Root Operator</title>
    <script>
      // Cursor companion view runs in a transparent BrowserWindow. Stamp
      // the html element BEFORE React mounts so Tailwind's body background
      // never paints opaque in this window.
      if (new URLSearchParams(location.search).get('view') === 'cursor-companion') {
        document.documentElement.classList.add('dark', 'cursor-companion-view');
      }
    </script>
    <style>
      html.cursor-companion-view,
      html.cursor-companion-view body,
      html.cursor-companion-view #root { background: transparent !important; }
      html.cursor-companion-view body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.jsx"></script>
  </body>
</html>
