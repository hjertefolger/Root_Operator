<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Root Operator</title>
    <script>
      // Transparent overlay views (cursor-companion, agent-avatar). Stamp
      // the html element BEFORE React mounts so Tailwind's body background
      // never paints opaque in these windows.
      (function () {
        var view = new URLSearchParams(location.search).get('view');
        if (view === 'cursor-companion' || view === 'agent-avatar') {
          document.documentElement.classList.add('dark', 'transparent-overlay-view');
        }
      })();
    </script>
    <style>
      html.transparent-overlay-view,
      html.transparent-overlay-view body,
      html.transparent-overlay-view #root { background: transparent !important; }
      html.transparent-overlay-view body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.jsx"></script>
  </body>
</html>
